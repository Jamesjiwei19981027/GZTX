name: CI

# 仓库此前没有任何 CI：Flutter 单测早已无法编译、Playwright 选择器全部失效，
# 都是几个月后才被发现。四端 monorepo + 多条长期分支，没有回归门禁等于裸奔。
#
# 三个 job 按路径过滤触发，互不阻塞；E2E 需要起后端+前端，单独放 e2e.yml 手动触发。

on:
  push:
    branches: [main, app]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install deps
        run: pip install -r requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/wiki-engine/package-lock.json

      - name: Build wiki engine
        # 项目 Wiki 测试会调用 wiki-engine/dist/wiki.js，与 Dockerfile 的 wiki-build 阶段一致
        working-directory: backend/wiki-engine
        run: npm ci && npm run build

      - name: Run tests
        run: pytest -q
        env:
          # 测试跑在开发档：DEBUG=false 会触发生产密钥门禁而拒绝启动
          DEBUG: 'true'

      - name: Alembic upgrade on empty DB
        # 迁移链断裂在部署时才发现代价太大，这里先在空库上跑一遍
        run: |
          mkdir -p data
          alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./data/ci_migration_check.db

  frontend:
    name: Frontend (typecheck + vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Typecheck
        # package.json 里类型检查脚本是 lint（tsc --noEmit），没有 typecheck
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  app:
    name: Flutter (analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # 与本地开发版本一致，避免新版 lint 或渲染差异让门禁漂移
          flutter-version: 3.44.7
          cache: true

      - name: Install deps
        run: flutter pub get

      - name: Analyze
        # 只让 error 级别卡门禁；info 级别的 lint 建议不阻塞
        run: flutter analyze --no-pub

      - name: Unit tests
        # 基准截图在 Windows 上生成，Linux 字体渲染不同必然逐像素不符；
        # 截图对比以本地 Windows 全量测试为准，CI 只跑非截图测试
        run: flutter test --no-pub --exclude-tags golden
