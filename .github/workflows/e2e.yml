name: E2E

# Playwright 冒烟需要真实起后端 + 前端并有一个可登录账号，跑一次几分钟。
# PR 门禁：前后端代码变更的 PR 必须过 E2E（路径过滤，纯文档/小程序/APP 变更不触发）；
# 另保留手动触发 / 每日定时兜底。
# 发布前必须在目标 SHA 上跑一次并留存报告——门禁文档里记录的"全绿"只对
# 当时那个 SHA 有效，不能拿旧结论给新提交背书。

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 每日 02:00 (UTC+8)

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright smoke (S1–S8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Start backend
        working-directory: backend
        env:
          DEBUG: 'true'
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
          RATE_LIMIT_ENABLED: 'false' # 冒烟会连续登录，限流会误伤
        run: |
          mkdir -p data
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: Seed E2E user
        working-directory: backend
        env:
          DEBUG: 'true'
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
        run: python scripts/seed_e2e_user.py

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start frontend dev server
        working-directory: frontend
        env:
          # vite 的 /api 代理默认打 8010（本机 Docker 后端），
          # CI 里后端起在 8000，必须显式指过去（见 frontend/vite.config.ts）
          DEV_API_TARGET: http://127.0.0.1:8000
        # 用例大多直接加载 /src、/@react-refresh、/node_modules/.vite 下的源码模块挂载单个组件，
        # 只有开发服务器能提供；打包产物由 ci.yml 的前端 job 验证，这里不再 build + preview
        run: |
          npx vite --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done

      - name: Run E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          E2E_USER: e2e_user
          E2E_PASSWORD: e2e-password-123
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
