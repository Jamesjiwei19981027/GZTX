name: E2E (manual)

# Playwright 冒烟需要真实起后端 + 前端并有一个可登录账号，跑一次几分钟，
# 因此不挂在每次 push 上，改为手动触发 / 每日定时。
# 发布前必须在目标 SHA 上跑一次并留存报告——门禁文档里记录的"全绿"只对
# 当时那个 SHA 有效，不能拿旧结论给新提交背书。

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *' # 每日 02:00 (UTC+8)

jobs:
  e2e:
    name: Playwright smoke (S1–S8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Start backend
        working-directory: backend
        env:
          DEBUG: 'true'
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
          RATE_LIMIT_ENABLED: 'false' # 冒烟会连续登录，限流会误伤
        run: |
          mkdir -p data
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done

      - name: Seed E2E user
        working-directory: backend
        env:
          DEBUG: 'true'
          DATABASE_URL: sqlite+aiosqlite:///./data/e2e.db
        run: python scripts/seed_e2e_user.py

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Build & preview frontend
        working-directory: frontend
        run: |
          npm run build
          npx vite preview --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:5173 >/dev/null && break
            sleep 1
          done

      - name: Run E2E
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5173
          E2E_USER: e2e_user
          E2E_PASSWORD: e2e-password-123
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
