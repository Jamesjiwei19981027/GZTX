<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #c2c6d6;
            border-radius: 4px;
        }
    </style>

<body class="bg-surface-container-high h-screen w-screen overflow-hidden flex items-center justify-center antialiased">
<!-- Blurred background simulating the underlying app -->
<div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1555421689-491a97ff2040?ixlib=rb-4.0.3&amp;auto=format&amp;fit=crop&amp;w=2070&amp;q=80')] bg-cover bg-center opacity-10 filter blur-sm"></div>
<!-- Overlay Wrapper -->
<div class="fixed inset-0 z-50 flex items-center justify-center bg-on-background/30 backdrop-blur-[2px] p-md">
<!-- Modal Container -->
<div class="bg-surface w-full max-w-[560px] rounded-xl shadow-[0_10px_25px_rgba(0,0,0,0.1)] flex flex-col overflow-hidden animate-[scale-in_0.2s_ease-out]">
<!-- Header -->
<div class="px-lg py-md border-b border-surface-variant flex items-center justify-between bg-surface-container-lowest">
<h2 class="font-headline-sm text-headline-sm text-on-surface">快速创建任务</h2>
<button aria-label="Close" class="text-on-surface-variant hover:bg-surface-container hover:text-on-surface rounded-full p-sm transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-primary/50">
<span class="material-symbols-outlined block">close</span>
</button>
</div>
<!-- Body -->
<div class="p-lg flex flex-col gap-lg bg-surface">
<!-- Source Information (Contextual awareness) -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface-variant">来源</label>
<div class="flex items-center gap-sm px-md py-sm rounded-lg bg-surface-container-low border border-surface-variant">
<div class="w-8 h-8 rounded-full bg-[#07C160]/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-[#07C160] text-[18px]" style="font-variation-settings: 'FILL' 1;">chat_bubble</span>
</div>
<div class="flex-1 min-w-0">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body-sm text-body-sm text-on-surface truncate cursor-default" readonly="" type="text" value="微信会话: 张经理"/>
</div>
<a class="text-primary hover:text-primary-container font-label-sm text-label-sm flex items-center gap-xs whitespace-nowrap transition-colors" href="#">
                            查看原文
                            <span class="material-symbols-outlined text-[14px]">open_in_new</span>
</a>
</div>
</div>
<!-- Task Title -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface" for="task-title">任务内容</label>
<textarea class="w-full border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none placeholder:text-outline" id="task-title" placeholder="输入任务名称..." rows="2">整理本季度销售数据并准备下周一的演示PPT</textarea>
</div>
<!-- Contextual Details (Extracted from source) -->
<div class="flex flex-col gap-sm">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant" for="task-details">备注细节</label>
<span class="font-label-sm text-label-sm text-primary bg-primary/10 px-2 py-0.5 rounded text-[10px] uppercase tracking-wider">自动提取</span>
</div>
<textarea class="w-full border border-surface-variant rounded-lg px-md py-sm font-body-sm text-body-sm text-on-surface-variant bg-surface-container-lowest focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all resize-none placeholder:text-outline" id="task-details" rows="3">重点突出华东区的增长情况，需要包含预测图表。</textarea>
</div>
<!-- Meta row: Deadline and Assignee -->
<div class="flex flex-col sm:flex-row gap-lg">
<!-- Deadline -->
<div class="flex flex-col gap-sm flex-1">
<label class="font-label-md text-label-md text-on-surface">截止时间</label>
<div class="relative group cursor-pointer">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-on-surface-variant group-hover:text-primary transition-colors pointer-events-none">calendar_month</span>
<input class="w-full border border-outline-variant rounded-lg pl-[44px] pr-md py-sm font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all cursor-pointer hover:border-outline" readonly="" type="text" value="今天 18:00"/>
</div>
</div>
<!-- Priority (Optional addition for workflow realism) -->
<div class="flex flex-col gap-sm flex-1">
<label class="font-label-md text-label-md text-on-surface">优先级</label>
<div class="relative">
<select class="w-full border border-outline-variant rounded-lg px-md py-sm font-body-md text-body-md text-on-surface bg-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-all appearance-none pr-10">
<option>高优先级</option>
<option selected="">普通优先级</option>
<option>低优先级</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
<!-- Footer Actions -->
<div class="px-lg py-md border-t border-surface-variant bg-surface-container-lowest flex items-center justify-between">
<div class="flex items-center gap-sm">
<button class="text-on-surface-variant hover:text-primary hover:bg-surface-container p-sm rounded-full transition-colors" title="添加附件">
<span class="material-symbols-outlined block text-[20px]">attach_file</span>
</button>
<button class="text-on-surface-variant hover:text-primary hover:bg-surface-container p-sm rounded-full transition-colors" title="添加标签">
<span class="material-symbols-outlined block text-[20px]">label</span>
</button>
</div>
<div class="flex items-center gap-sm">
<button class="px-md py-2 rounded-lg font-label-md text-label-md text-on-surface-variant hover:bg-surface-container-low transition-colors">
                        取消
                    </button>
<button class="px-lg py-2 rounded-lg font-label-md text-label-md bg-primary text-on-primary hover:bg-primary/90 hover:shadow-md transition-all active:scale-[0.98]">
                        创建任务
                    </button>
</div>
</div>
</div>
</div>
<style>
        @keyframes scale-in {
            0% { opacity: 0; transform: scale(0.95); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
