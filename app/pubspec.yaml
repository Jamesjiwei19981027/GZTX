name: worktodo_app
description: WorkTodo mobile client for iOS and Android.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.3.3
  provider: ^6.1.2
  intl: ^0.20.2
  google_fonts: ^6.2.1
  webview_flutter: ^4.10.0
  go_router: ^17.5.0
  flutter_secure_storage: ^11.2.0
  file_picker: ^13.3.1
  image_picker: ^1.2.4
  mime: ^2.1.0
  open_filex: ^5.0.0
  path_provider: ^2.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
  url_launcher: ^6.3.3
  flutter_localizations:
    sdk: flutter
  clock: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
