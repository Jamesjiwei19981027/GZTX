# 本机内测覆盖文件：与 docker-compose.prod.yml 叠加使用，不修改 prod 本身。
#
# 启动：
#   docker compose -p gztx-beta -f docker-compose.prod.yml -f docker-compose.beta.yml \
#     --env-file .env.beta up -d --build
#
# 与 prod 的差异：
#   1. 对外只开 8088 端口（容器内仍是 80），去掉 443，纯 http；
#   2. 各服务读取 .env.beta（而不是 prod 默认的 .env）；
#   3. 把 backend/scripts 只读挂进后端容器，用于执行初始化脚本
#      （生产镜像只打包了 app 与 alembic，不含 scripts）。
# 使用 -p gztx-beta 项目名，容器、网络、数据卷都带 gztx-beta 前缀，
# 不会与本机开发环境或其他项目冲突。

services:
  migrate:
    env_file: !override
      - .env.beta

  backend:
    env_file: !override
      - .env.beta
    volumes:
      - ./backend/scripts:/app/scripts:ro

  scheduler:
    env_file: !override
      - .env.beta

  extractor:
    env_file: !override
      - .env.beta

  nginx:
    ports: !override
      - "8088:80"
