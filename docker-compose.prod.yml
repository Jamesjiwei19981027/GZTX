version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY=${SECRET_KEY}
      - APP_NAME=Worktodo
      - APP_VERSION=1.0.0
      - DEBUG=false
      - WX_APP_ID=${WX_APP_ID}
      - WX_APP_SECRET=${WX_APP_SECRET}
      - API_V1_PREFIX=/api/v1
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - db
    networks:
      - worktodo-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    networks:
      - worktodo-network

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-worktodo}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-worktodo123}
      - POSTGRES_DB=${DB_NAME:-worktodo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - worktodo-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-worktodo}"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./certbot/conf:/etc/letsencrypt/live
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - worktodo-network

volumes:
  postgres_data:

networks:
  worktodo-network:
    driver: bridge