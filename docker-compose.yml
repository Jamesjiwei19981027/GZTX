services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktodo-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
    environment:
      - APP_NAME=WorkTodo
      - APP_VERSION=1.0.0
      - DEBUG=true
      - DATABASE_URL=sqlite+aiosqlite:///./data/worktodo.db
      - SECRET_KEY=dev-secret-key-please-change-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - WX_APP_ID=your-wx-app-id
      - WX_APP_SECRET=your-wx-app-secret
      - CORS_ORIGINS=["http://localhost:5173","http://localhost:3000","http://localhost:80"]
      - UPLOAD_DIR=./data/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worktodo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: worktodo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  frontend_node_modules:
