# 开发编排：热重载前后端 + nginx 反代
# 用法: docker compose up -d
# 敏感项请用 .env 覆盖，勿把真实密码提交进仓库

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktodo-backend
    ports:
      # 宿主 8010（Windows 上 8000 常被系统服务占用）→ 容器 8000
      - "8010:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/alembic:/app/alembic
      - ./backend/alembic.ini:/app/alembic.ini:ro
      # 复用本地开发 SQLite（backend/data），容器与本地进程模式数据一致
      - ./backend/data:/app/data
    env_file:
      - path: .env
        required: false
    environment:
      - APP_NAME=WorkTodo
      - APP_VERSION=1.0.0
      - DEBUG=${DEBUG:-true}
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL:-sqlite+aiosqlite:///./data/worktodo.db}
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-please-change-in-production}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=15
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - WX_APP_ID=${WX_APP_ID:-}
      - WX_APP_SECRET=${WX_APP_SECRET:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:5173","http://localhost:3000","http://localhost:80"]}
      - UPLOAD_DIR=./data/uploads
      - APP_URL=${APP_URL:-http://localhost}
      - DEPLOY_MODE=${DEPLOY_MODE:-single_company}
      - DEFAULT_COMPANY_SLUG=${DEFAULT_COMPANY_SLUG:-default}
      - LICENSE_VERIFY_MODE=${LICENSE_VERIFY_MODE:-hmac}
      - LICENSE_PUBLIC_KEY=${LICENSE_PUBLIC_KEY:-dev-secret-key-for-tests-only}
      - AUTO_CREATE_SCHEMA=${AUTO_CREATE_SCHEMA:-true}
      - ALLOW_FAKE_SSO=${ALLOW_FAKE_SSO:-true}
      - COLLAB_OBJECT_ROOT=data/objects
      - WEBRTC_STUN_URLS=${WEBRTC_STUN_URLS:-}
      - WEBRTC_TURN_URLS=${WEBRTC_TURN_URLS:-}
      - WEBRTC_TURN_USERNAME=${WEBRTC_TURN_USERNAME:-}
      - WEBRTC_TURN_CREDENTIAL=${WEBRTC_TURN_CREDENTIAL:-}
      - INTEGRATION_SECRET_KEY=${INTEGRATION_SECRET_KEY:-}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - IMAP_HOST=${IMAP_HOST:-}
      - IMAP_PORT=${IMAP_PORT:-993}
      - IMAP_USER=${IMAP_USER:-}
      - IMAP_PASSWORD=${IMAP_PASSWORD:-}
      - EMAIL_REPLY_DOMAIN=${EMAIL_REPLY_DOMAIN:-}
      - EMAIL_REPLY_SECRET=${EMAIL_REPLY_SECRET:-change-me}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-mailto:admin@example.com}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: worktodo-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      - VITE_API_BASE_URL=/api/v1
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: worktodo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

volumes:
  frontend_node_modules:
