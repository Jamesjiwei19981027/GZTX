version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: worktodo-backend:latest
    container_name: worktodo-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://worktodo:worktodo@postgres:5432/worktodo
      - SECRET_KEY=${SECRET_KEY}
      - DEBUG=false
      - SCHEDULER_ENABLED=true
    depends_on:
      - postgres
    volumes:
      - backend-data:/app/data
    networks:
      - worktodo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: worktodo-frontend:latest
    container_name: worktodo-frontend
    restart: always
    command: npm run build && npm run preview -- --host
    ports:
      - "3000:3000"
    networks:
      - worktodo-network

  nginx:
    image: nginx:alpine
    container_name: worktodo-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - worktodo-network

  postgres:
    image: postgres:15-alpine
    container_name: worktodo-postgres
    restart: always
    environment:
      - POSTGRES_USER=worktodo
      - POSTGRES_PASSWORD=worktodo
      - POSTGRES_DB=worktodo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - worktodo-network

volumes:
  backend-data:
  postgres-data:

networks:
  worktodo-network:
    driver: bridge
