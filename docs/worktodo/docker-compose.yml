version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worktodo-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./worktodo.db
      - SECRET_KEY=dev-secret-key-change-in-production
      - DEBUG=true
    volumes:
      - ./backend:/app
      - backend-data:/app/data
    networks:
      - worktodo-network

  frontend:
    image: node:18-alpine
    container_name: worktodo-frontend
    working_dir: /app
    command: npm run dev -- --host
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - worktodo-network

  nginx:
    image: nginx:alpine
    container_name: worktodo-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - frontend
    networks:
      - worktodo-network

volumes:
  backend-data:

networks:
  worktodo-network:
    driver: bridge
