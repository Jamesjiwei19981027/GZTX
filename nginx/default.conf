# 开发编排（docker-compose.yml）。生产用 default.prod.conf。
#
# 同样用 Docker 内嵌 DNS 运行时解析容器名：写死 upstream / proxy_pass 主机名时，
# nginx 启动即解析并永久缓存 IP，重建 frontend/backend 后会一直打旧 IP 报 502。
# proxy_pass 含变量后不再做 location 前缀替换，故一律不写 URI 部分，原样透传。

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name localhost;

    set $backend_host  backend;
    set $frontend_host frontend;

    # 前端 - 代理到 Vite 开发服务器
    location / {
        proxy_pass http://$frontend_host:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API 代理
    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Swagger 文档
    location /docs {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }
}
