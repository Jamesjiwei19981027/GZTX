# 生产：前端静态容器 + 后端 API + TLS 终结在外层
#
# HTTPS 启用步骤（首次部署）：
# 1. 仅用本文件的 80 端口块启动（443 块保持注释），DNS 指向本机；
# 2. 签发证书：
#    docker compose -f docker-compose.prod.yml run --rm \
#      -v ./certbot/conf:/etc/letsencrypt -v ./certbot/www:/var/www/certbot \
#      certbot/certbot certonly --webroot -w /var/www/certbot -d <你的域名>
# 3. 将下方 443 server 块取消注释、替换 <你的域名>，然后：
#    docker compose -f docker-compose.prod.yml exec nginx nginx -s reload

upstream backend_upstream {
    server backend:8000;
}

upstream frontend_upstream {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # certbot http-01 续期挑战（必须在最前，不能被转发到 frontend）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/ {
        proxy_pass http://backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://backend_upstream/redoc;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    # 前端静态（frontend 容器内 nginx）
    location / {
        proxy_pass http://frontend_upstream/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

