# 生产：前端静态容器 + 后端 API + TLS 终结在外层
#
# HTTPS 启用步骤（首次部署）：
# 1. 仅用本文件的 80 端口块启动（443 块保持注释），DNS 指向本机；
# 2. 签发证书：
#    docker compose -f docker-compose.prod.yml run --rm \
#      -v ./certbot/conf:/etc/letsencrypt -v ./certbot/www:/var/www/certbot \
#      certbot/certbot certonly --webroot -w /var/www/certbot -d <你的域名>
# 3. 将下方 443 server 块取消注释、替换 <你的域名>，然后：
#    docker compose -f docker-compose.prod.yml exec nginx nginx -s reload
#
# —— 为什么不再用 upstream 块 ——
# 原先是 `upstream backend_upstream { server backend:8000; }`：nginx 只在启动时
# 解析一次容器名并永久缓存 IP。docker compose 重建 frontend/backend 后容器换了 IP，
# nginx 仍打旧地址 → 502，必须重启 nginx 才恢复（这就是「重建前端后偶发 502」的根因）。
# 改用 Docker 内嵌 DNS（127.0.0.11）+ proxy_pass 带变量，强制运行时解析。
# 注意：proxy_pass 一旦含变量就不再做「location 前缀替换」，因此这里一律
# **不写 URI 部分**，让原始请求 URI 原样透传（与旧配置的映射结果等价）。

resolver 127.0.0.11 valid=10s ipv6=off;

# 认证接口限流兜底。应用层已有 DB 支撑的限流（app/services/rate_limit.py），
# 这一层挡的是根本不该打到应用的洪水，省掉每次爆破的 bcrypt + DB 往返。
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    client_max_body_size 32m;

    # 容器名留到运行时解析（配合上面的 resolver）
    set $backend_host  backend;
    set $frontend_host frontend;

    # certbot http-01 续期挑战（必须在最前，不能被转发到 frontend）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 登录/发码/注册：正则 location 优先级高于下面的 /api/ 前缀
    location ~ ^/api/v1/auth/(login|login-code|send-code|register)$ {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }

    location /docs {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }

    location /redoc {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
    }

    # 一页静态产品介绍
    location /landing/ {
        alias /usr/share/nginx/html/landing/;
        index index.html;
    }

    # 前端静态（frontend 容器内 nginx）
    location / {
        proxy_pass http://$frontend_host:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

